<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食堂订餐系统</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/interactions.css">
    <style>
        html { background: #292524; }
        body { opacity: 0; transition: opacity 0.3s ease-out; }
        body.page-ready { opacity: 1; }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.body.classList.add('page-ready');
        });
    </script>
</head>
<body>
<div class="hero">
    <div class="hero-card reveal">
        <div class="hero-icon">🍽️</div>
        <h1>食堂订餐</h1>
        <p class="hero-subtitle">今日菜单、在线下单、订单跟踪，一站式校园订餐服务</p>
        <div class="hero-actions">
            <a th:href="@{/login}" class="btn btn-primary btn-lg btn-ripple btn-press">登录使用</a>
            <a th:href="@{/register}" class="btn btn-outline btn-lg btn-ripple btn-press">注册账号</a>
        </div>
        <div class="hero-features">
            <div class="hero-feature">
                <div class="feature-icon">📋</div>
                <div class="feature-label">浏览菜单</div>
            </div>
            <div class="hero-feature">
                <div class="feature-icon">🛒</div>
                <div class="feature-label">在线订餐</div>
            </div>
            <div class="hero-feature">
                <div class="feature-icon">⭐</div>
                <div class="feature-label">美食评价</div>
            </div>
        </div>
    </div>
</div>
<script src="/js/interactions.js" defer></script>
</body>
</html>
