<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 食堂订餐系统</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/interactions.css">
    <style>
        html { background: #292524; }
        body { opacity: 0; transition: opacity 0.3s ease-out; }
        body.page-ready { opacity: 1; }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.body.classList.add('page-ready');
        });
    </script>
</head>
<body>
<div class="auth-page">
    <div class="auth-card reveal" style="width:460px;">
        <h2>用户注册</h2>
        <div th:if="${error}" class="auth-error" th:text="${error}"></div>
        <form method="post" action="/register">
            <div class="form-group">
                <label class="form-label" for="username">用户名 *</label>
                <input class="form-input" type="text" id="username" name="username" required placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label class="form-label" for="password">密码 *</label>
                <input class="form-input" type="password" id="password" name="password" required placeholder="请输入密码">
            </div>
            <div class="form-group">
                <label class="form-label" for="realName">真实姓名 *</label>
                <input class="form-input" type="text" id="realName" name="realName" required placeholder="请输入真实姓名">
            </div>
            <div style="display:flex; gap:1rem;">
                <div class="form-group" style="flex:1;">
                    <label class="form-label" for="phone">手机号</label>
                    <input class="form-input" type="text" id="phone" name="phone" placeholder="选填">
                </div>
                <div class="form-group" style="flex:1;">
                    <label class="form-label" for="department">部门</label>
                    <input class="form-input" type="text" id="department" name="department" placeholder="选填">
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-ripple btn-press" style="width:100%; padding:0.75rem;">注 册</button>
        </form>
        <div class="auth-footer">
            已有账号？<a th:href="@{/login}">立即登录</a>
        </div>
    </div>
</div>
<script src="/js/interactions.js" defer></script>
</body>
</html>
