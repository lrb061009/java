<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单 - 食堂订餐系统</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/interactions.css">
    <style>
        html { background: var(--color-bg); }
        body { opacity: 0; transition: opacity 0.3s ease-out; }
        body.page-ready { opacity: 1; }
        .remark-text { color: var(--color-text-muted); font-size: var(--text-xs); font-style: italic; }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function() { document.body.classList.add('page-ready'); });
    </script>
</head>
<body>
<div class="app-header">
    <span class="app-header-brand">🍽️ 食堂订餐</span>
    <div class="app-header-right">
        <span class="user-greeting">欢迎，<span th:text="${user.realName}">用户</span></span>
        <span class="user-balance">余额：¥<span th:text="${user.balance}">0.00</span></span>
        <button class="btn-recharge btn-press" onclick="showRechargeModal()">充值</button>
    </div>
    <nav class="app-nav">
        <a th:if="${user.role == 'ADMIN'}" th:href="@{/admin}" style="background:rgba(255,255,255,0.2);">管理后台</a>
        <a th:if="${user.role == 'MERCHANT'}" th:href="@{/merchant}" style="background:rgba(255,255,255,0.2);">商家后台</a>
        <a th:href="@{/home}">今日菜单</a>
        <a th:href="@{/my-orders}" class="active">我的订单</a>
        <a th:href="@{/my-reviews}">我的评价</a>
        <a th:href="@{/logout}">退出</a>
    </nav>
</div>

<div class="content" style="max-width:900px;">
    <div class="section-header mb-4">
        <h3 style="font-size:var(--text-lg); color:var(--color-text);">我的订单</h3>
    </div>

    <div th:if="${#lists.isEmpty(orders)}" class="empty-state">
        <div class="empty-icon">📦</div>
        <p class="empty-text">暂无订单</p>
        <a th:href="@{/home}" class="btn btn-primary btn-ripple btn-press">去下单</a>
    </div>

    <div class="order-list reveal-stagger" th:if="${!#lists.isEmpty(orders)}">
        <div class="order-card reveal" th:each="order : ${orders}">
            <div class="order-header">
                <span class="order-id">订单 #<span th:text="${order.id}">1</span></span>
                <span class="badge"
                      th:classappend="${order.status == 'PENDING'} ? 'badge-warn' : (${order.status == 'CONFIRMED'} ? 'badge-info' : (${order.status == 'COMPLETED'} ? 'badge-success' : 'badge-danger'))"
                      th:text="${order.status == 'PENDING'} ? '待处理' : (${order.status == 'CONFIRMED'} ? '已确认' : (${order.status == 'COMPLETED'} ? '已完成' : '已取消'))">状态</span>
            </div>

            <div class="take-code" th:if="${order.takeCode != null}">
                取餐码：<span th:text="${order.takeCode}">123456</span>
            </div>

            <div class="order-detail-list">
                <div class="order-detail-item" th:each="detail : ${order.orderDetails}">
                    <span th:text="${detail.menu.name}">菜品名称</span>
                    <span style="color:var(--color-text-muted);">x<span th:text="${detail.quantity}">1</span></span>
                    <span class="detail-price">¥<span th:text="${detail.price}">0.00</span></span>
                </div>
            </div>

            <div class="order-total">合计：¥<span th:text="${order.totalPrice}">0.00</span></div>

            <div class="order-meta" th:text="'下单时间：' + ${#temporals.format(order.orderTime, 'yyyy-MM-dd HH:mm:ss')}">时间</div>
            <div th:if="${order.remark}" class="remark-text" th:text="'备注：' + ${order.remark}"></div>

            <div class="order-actions">
                <span class="badge"
                      th:classappend="${paymentStatusMap.getOrDefault(order.id, 'UNPAID') == 'PAID'} ? 'badge-success' : (${paymentStatusMap.getOrDefault(order.id, 'UNPAID') == 'REFUNDED'} ? 'badge-danger' : 'badge-warn')"
                      th:text="${paymentStatusMap.getOrDefault(order.id, 'UNPAID') == 'PAID'} ? '已支付' : (${paymentStatusMap.getOrDefault(order.id, 'UNPAID') == 'REFUNDED'} ? '已退款' : '未支付')">已支付</span>

                <button th:if="${order.status == 'PENDING'}" class="btn btn-danger btn-sm btn-ripple btn-press"
                        th:data-id="${order.id}" onclick="cancelOrder(this.dataset.id)">取消订单</button>

                <th:block th:if="${order.status == 'CONFIRMED' || order.status == 'COMPLETED'}">
                    <th:block th:each="detail : ${order.orderDetails}">
                        <button class="btn btn-outline btn-sm btn-ripple btn-press"
                                th:if="${!#sets.contains(reviewedKeys, '' + order.id + '-' + detail.menu.id)}"
                                th:attr="data-orderid=${order.id},data-menuid=${detail.menu.id},data-menuname=${detail.menu.name}"
                                onclick="showReviewModalFromBtn(this)"
                                th:text="'评价 ' + ${detail.menu.name}">评价</button>
                        <span th:if="${#sets.contains(reviewedKeys, '' + order.id + '-' + detail.menu.id)}"
                              style="color:var(--color-success); font-size:var(--text-sm); font-weight:600;"
                              th:text="'✓ 已评价 ' + ${detail.menu.name}"></span>
                    </th:block>
                </th:block>
            </div>
        </div>
    </div>
</div>

<!-- Recharge Modal -->
<div id="rechargeModal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
        <h3>账户充值</h3>
        <p class="text-muted mb-4" style="font-size:var(--text-sm);">当前余额：¥<span th:text="${user.balance}">0.00</span></p>
        <div class="form-group">
            <label class="form-label">充值金额</label>
            <input class="form-input" type="number" id="rechargeAmount" value="100" min="1" step="0.01">
        </div>
        <div class="btn-row">
            <button id="rechargeSubmitBtn" onclick="submitRecharge()" class="btn btn-success btn-ripple btn-press">确认充值</button>
            <button onclick="closeRechargeModal()" class="btn btn-ghost">取消</button>
        </div>
    </div>
</div>

<!-- Review Modal -->
<div id="reviewModal" class="modal-overlay" style="display:none;">
    <div class="modal-card" style="width:440px;">
        <h3>评价 - <span id="reviewMenuName"></span></h3>
        <div class="form-group">
            <label class="form-label">评分</label>
            <div class="star-rating" id="starRating">
                <span class="star" onclick="setRating(1)">★</span>
                <span class="star" onclick="setRating(2)">★</span>
                <span class="star" onclick="setRating(3)">★</span>
                <span class="star" onclick="setRating(4)">★</span>
                <span class="star" onclick="setRating(5)">★</span>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">评价内容</label>
            <textarea class="form-input" id="reviewComment" rows="3" placeholder="分享你的用餐体验..."></textarea>
        </div>
        <div class="btn-row">
            <button id="reviewSubmitBtn" onclick="submitReview()" class="btn btn-primary btn-ripple btn-press">提交评价</button>
            <button onclick="closeReviewModal()" class="btn btn-ghost">取消</button>
        </div>
    </div>
</div>

<script>
function showRechargeModal() {
    var modal = document.getElementById('rechargeModal');
    modal.style.display = 'flex';
    modal.classList.remove('modal-hidden');
}
function closeRechargeModal() {
    var modal = document.getElementById('rechargeModal');
    modal.classList.add('modal-hidden');
    setTimeout(function() { modal.style.display = 'none'; }, 250);
}
function submitRecharge() {
    var amount = document.getElementById('rechargeAmount').value;
    if (!amount || parseFloat(amount) <= 0) {
        Toast.show('请输入有效的充值金额', 'error');
        return;
    }
    var userId = [[${user.id}]];
    asyncSubmit(
        fetch('/api/user/charge', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: userId.toString(), amount: amount })
        }),
        { submitBtn: '#rechargeSubmitBtn', successMsg: '充值成功！', errorMsg: '充值失败', loadingText: '充值中...', reload: true }
    );
}

var currentOrderId = null;
var currentMenuId = null;
var currentRating = 0;

function cancelOrder(orderId) {
    if (!confirm('确定要取消这个订单吗？')) return;
    asyncSubmit(
        fetch('/api/order/' + orderId + '/cancel', { method: 'PUT' }),
        { successMsg: '订单已取消', errorMsg: '取消失败', loadingText: '取消中...', reload: true }
    );
}

function showReviewModal(orderId, menuId, menuName) {
    currentOrderId = orderId;
    currentMenuId = menuId;
    document.getElementById('reviewMenuName').textContent = menuName;
    var modal = document.getElementById('reviewModal');
    modal.style.display = 'flex';
    modal.classList.remove('modal-hidden');
    currentRating = 0;
    updateStars();
    document.getElementById('reviewComment').value = '';
}

function showReviewModalFromBtn(btn) {
    showReviewModal(parseInt(btn.dataset.orderid), parseInt(btn.dataset.menuid), btn.dataset.menuname);
}

function closeReviewModal() {
    var modal = document.getElementById('reviewModal');
    modal.classList.add('modal-hidden');
    setTimeout(function() { modal.style.display = 'none'; }, 250);
}

function setRating(r) {
    currentRating = r;
    updateStars();
}

function updateStars() {
    var stars = document.getElementById('starRating').querySelectorAll('.star');
    for (var i = 0; i < stars.length; i++) {
        if (i < currentRating) {
            stars[i].classList.add('active');
        } else {
            stars[i].classList.remove('active');
        }
    }
}

function submitReview() {
    if (currentRating === 0) {
        Toast.show('请选择评分', 'error');
        return;
    }
    var comment = document.getElementById('reviewComment').value;
    var userId = [[${user.id}]];
    asyncSubmit(
        fetch('/api/review', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: userId, menuId: currentMenuId, orderId: currentOrderId, rating: currentRating, comment: comment })
        }),
        { submitBtn: '#reviewSubmitBtn', successMsg: '评价成功！', errorMsg: '评价失败', loadingText: '提交中...', reload: true }
    );
}
</script>
<script src="/js/interactions.js" defer></script>
</body>
</html>
