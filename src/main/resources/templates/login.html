<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 食堂订餐系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: white; border-radius: 16px; padding: 2.5rem; width: 400px; max-width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        h2 { text-align: center; margin-bottom: 1.5rem; color: #333; font-size: 1.8rem; }
        .error { background: #fee2e2; color: #dc2626; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; text-align: center; }
        label { display: block; margin-bottom: 0.4rem; color: #555; font-weight: 500; font-size: 0.95rem; }
        input { width: 100%; padding: 0.7rem 0.9rem; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; margin-bottom: 1rem; transition: border-color 0.3s; }
        input:focus { outline: none; border-color: #667eea; }
        button { width: 100%; padding: 0.8rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: opacity 0.3s; }
        button:hover { opacity: 0.9; }
        .link { text-align: center; margin-top: 1rem; color: #666; font-size: 0.9rem; }
        .link a { color: #667eea; text-decoration: none; }
        .back { text-align: center; margin-top: 0.5rem; }
        .back a { color: #999; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="card">
    <h2>用户登录</h2>
    <div th:if="${error}" class="error" th:text="${error}"></div>
    <form method="post" action="/login">
        <label for="username">用户名</label>
        <input type="text" id="username" name="username" required placeholder="请输入用户名">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" required placeholder="请输入密码">
        <button type="submit">登 录</button>
    </form>
    <div class="link">还没有账号？<a th:href="@{/register}">立即注册</a></div>
    <div class="back"><a th:href="@{/}">返回首页</a></div>
</div>
</body>
</html>
