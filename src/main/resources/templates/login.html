<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 食堂订餐系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/interactions.css">
    <style>
        html { background: #1c1917; }
        body { opacity: 0; transition: opacity 0.3s ease-out; }
        body.page-ready { opacity: 1; }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.body.classList.add('page-ready');
        });
    </script>
</head>
<body>
<main class="auth-page" role="main" aria-label="登录页面">
    <div class="auth-card reveal" role="form" aria-label="登录表单">
        <h2>用户登录</h2>
        <div th:if="${error}" class="auth-error" role="alert" th:text="${error}"></div>
        <form method="post" action="/login" novalidate>
            <div class="form-group">
                <label class="form-label" for="username">用户名</label>
                <input class="form-input" type="text" id="username" name="username"
                       required placeholder="请输入用户名" autocomplete="username" autofocus>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">密码</label>
                <input class="form-input" type="password" id="password" name="password"
                       required placeholder="请输入密码" autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-ripple btn-press" style="width:100%; padding:0.8rem;">
                登 录
            </button>
        </form>
        <div class="auth-footer">
            还没有账号？<a th:href="@{/register}">立即注册</a>
        </div>
        <div class="text-center mt-2">
            <a th:href="@{/}" class="text-muted" style="font-size:var(--text-sm);">← 返回首页</a>
        </div>
    </div>
</main>
<script src="/js/interactions.js" defer></script>
</body>
</html>
